name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: schema, references, secrets, ascii
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Prove the template still generates
        run: npm run proof

      - name: Confirm the landing page quotes real terminal output
        run: |
          # The page shows two transcripts. Every count in them moves when the
          # repo does, so they go stale silently and the page starts lying about
          # its own tooling. Compare both against the runs that just happened
          # rather than trusting the page. The file count had already drifted
          # twice before this check existed.
          sed 's/<[^>]*>//g' site/index.html > /tmp/page.txt

          check() {
            sed -n "/^$2\$/,/^$3\$/p" /tmp/page.txt > /tmp/claimed.txt
            if [ ! -s /tmp/claimed.txt ]; then
              echo "::error::could not find the $1 transcript in site/index.html"
              exit 1
            fi
            diff -u /tmp/claimed.txt /tmp/actual.txt || {
              echo "::error::the $1 transcript in site/index.html no longer matches real output"
              exit 1
            }
            echo "$1 transcript matches real output"
          }

          npm run validate --silent | sed -n '/^Agent Spark validator$/,/^PASSED\.$/p' > /tmp/actual.txt
          check validator 'Agent Spark validator' 'PASSED\.'

          npm run proof --silent | sed -n '/^Agent Spark round-trip proof$/,/^PASSED\..*$/p' > /tmp/actual.txt
          check proof 'Agent Spark round-trip proof' 'PASSED\..*'

      - name: Confirm no template variables leaked into samples
        run: |
          # Scans sample PROJECT directories, not samples/README.md. The README
          # is documentation about the samples, and it has to be able to quote
          # the variable syntax when telling contributors to grep for it.
          # samples/*/ expands to the project directories only, so the carve-out
          # needs no maintained exclusion list.
          if grep -rn '{{' samples/*/ ; then
            echo "::error::a sample project contains unreplaced template variables"
            exit 1
          fi
          echo "sample projects are fully rendered"

      - name: Confirm no template ships with publishing enabled
        run: |
          if grep -rn 'publishByDefault:\s*true' templates/ ; then
            echo "::error::a template sets publishByDefault true, which the schema forbids"
            exit 1
          fi
          if grep -rEn '^publish:\s*true' templates/ ; then
            echo "::error::a template ships with publish enabled"
            exit 1
          fi
          echo "publishing is disabled across all templates"

  links:
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check relative links resolve
        run: |
          # Reports every broken link rather than the first, because fixing
          # links one CI run at a time is a waste of everyone's afternoon.
          #
          # Skipped by design:
          #   - absolute URLs and mailto
          #   - ../../issues, ../../discussions and friends. These are GitHub
          #     web shorthand that resolve against the repository URL, not the
          #     file tree. They are used instead of absolute URLs so they
          #     survive a fork or a repository rename. See ADR-0004: the name
          #     is not settled.
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            targets=$(grep -oE '\]\([^)#][^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:|\$|#)' \
              | grep -vE '^\.\./\.\./(issues|discussions|pulls|wiki|releases|actions|security)(/|$)' \
              || true)
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $target"
                fail=1
              fi
            done <<< "$targets"
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$fail" -ne 0 ]; then
            echo "one or more relative links do not resolve"
            exit 1
          fi
          echo "relative links resolve"
